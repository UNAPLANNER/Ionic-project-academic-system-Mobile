<ion-content class="register-content">
  <div class="register-container">

    <div class="register-header">
      <ion-icon name="person-add-outline" class="register-icon"></ion-icon>
      <h1>Create Account</h1>
      <p>Join the Academic System</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onRegister()">

      <ion-item [class.ion-invalid]="nameControl?.invalid && nameControl?.touched">
        <ion-label position="floating">Full Name</ion-label>
        <ion-input type="text" formControlName="name"></ion-input>
        <ion-note slot="error">Name must be at least 3 characters</ion-note>
      </ion-item>

      <ion-item [class.ion-invalid]="emailControl?.invalid && emailControl?.touched">
        <ion-label position="floating">Email</ion-label>
        <ion-input type="email" formControlName="email"></ion-input>
        <ion-note slot="error">Enter a valid email address</ion-note>
      </ion-item>

      <ion-item [class.ion-invalid]="passwordControl?.invalid && passwordControl?.touched">
        <ion-label position="floating">Password</ion-label>
        <ion-input [type]="showPassword ? 'text' : 'password'" formControlName="password"></ion-input>
        <ion-button slot="end" fill="clear" (click)="togglePassword()">
          <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
        </ion-button>
        <ion-note slot="error">Password must be at least 6 characters</ion-note>
      </ion-item>

      <ion-item [class.ion-invalid]="confirmPasswordControl?.invalid && confirmPasswordControl?.touched">
        <ion-label position="floating">Confirm Password</ion-label>
        <ion-input type="password" formControlName="confirmPassword"></ion-input>
        <ion-note slot="error">Passwords do not match</ion-note>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Role</ion-label>
        <ion-select formControlName="role" interface="popover">
          <ion-select-option *ngFor="let r of roles" [value]="r.value">
            {{ r.label }}
          </ion-select-option>
        </ion-select>
      </ion-item>

      <ion-button expand="block" type="submit" class="register-btn">
        Create Account
      </ion-button>

    </form>

    <div class="login-link">
      <p>Already have an account?
        <span (click)="goToLogin()">Sign in</span>
      </p>
    </div>

  </div>
</ion-content>
