<ion-header [translucent]="true">
  <ion-toolbar class="academic-header">
    <ion-title>Mis Notas</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="notes-page-background">

  <div *ngIf="loading" class="ion-text-center ion-padding">
    <ion-spinner name="crescent" color="primary"></ion-spinner>
  </div>

  <div *ngIf="!loading && evaluations.length > 0" class="cards-grid-container">

    <div *ngFor="let ev of evaluations" class="evaluation-card-wrapper">
      
      <div class="evaluation-card academic-shadow" [ngStyle]="getEvaluationCardStyle(ev)">
        
        <div class="card-header-row">
          <div class="title-group">
            <span class="exam-type-title">Examen</span>
            <ion-icon name="school" class="exam-icon"></ion-icon>
          </div>
          
          <div class="score-badge-container">
            <span class="score-number">{{ ev.score }}/{{ ev.maxScore }}</span>
            <span class="score-percent">{{ scorePercent(ev) }}%</span>
          </div>
        </div>

        <div class="card-body-section">
          
          <div class="data-field-group">
            <label class="field-label">CURSO</label>
            <p class="field-value">{{ getCourseName(ev.courseId) }}</p>
          </div>

          <div class="data-field-group">
            <label class="field-label">DESCRIPCIÓN</label>
            <p class="field-value">{{ ev.description }}</p>
          </div>

          <div class="data-field-group">
            <label class="field-label">FECHA</label>
            <p class="field-value">{{ ev.date | date:'mediumDate' }}</p>
          </div>

        </div>

      </div>

    </div>

  </div>

  <div *ngIf="!loading && evaluations.length === 0" class="no-data-container">
    <ion-icon name="document-outline" class="no-data-icon"></ion-icon>
    <p>No tienes evaluaciones aún.</p>
  </div>

</ion-content>
